<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>

  <!-- Halo Ring -->
  <circle cx="256" cy="220" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>
  <circle cx="256" cy="220" r="102" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- Rays -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.35">
    <line x1="256" y1="90" x2="256" y2="70"/>
    <line x1="256" y1="350" x2="256" y2="370"/>
    <line x1="126" y1="220" x2="106" y2="220"/>
    <line x1="386" y1="220" x2="406" y2="220"/>
    <line x1="164" y1="128" x2="150" y2="114"/>
    <line x1="348" y1="128" x2="362" y2="114"/>
    <line x1="164" y1="312" x2="150" y2="326"/>
    <line x1="348" y1="312" x2="362" y2="326"/>
  </g>

  <!-- Orthodox 3-Bar Cross -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- Vertical Post -->
    <rect x="242" y="100" width="28" height="290" rx="6"/>

    <!-- Top Inscription Bar (INRI / Titulus) -->
    <rect x="210" y="135" width="92" height="20" rx="4"/>

    <!-- Main Horizontal Beam -->
    <rect x="156" y="195" width="200" height="24" rx="5"/>

    <!-- Slanted Footrest (Suppedaneum) -->
    <g transform="rotate(-18 256 335)">
      <rect x="200" y="325" width="112" height="20" rx="4"/>
    </g>
  </g>

  <!-- IC XC NIKA Inscriptions -->
  <text x="180" y="185" fill="#fef08a" font-family="'Times New Roman', serif" font-weight="bold" font-size="20" opacity="0.85" text-anchor="middle">IC</text>
  <text x="332" y="185" fill="#fef08a" font-family="'Times New Roman', serif" font-weight="bold" font-size="20" opacity="0.85" text-anchor="middle">XC</text>
  <text x="195" y="380" fill="#ca8a04" font-family="'Times New Roman', serif" font-weight="bold" font-size="18" opacity="0.8" text-anchor="middle">NI</text>
  <text x="317" y="380" fill="#ca8a04" font-family="'Times New Roman', serif" font-weight="bold" font-size="18" opacity="0.8" text-anchor="middle">KA</text>
</svg>
