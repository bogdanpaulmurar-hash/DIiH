<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="candleBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2a1b18"/>
      <stop offset="55%" stop-color="#120c14"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="1"/>
      <stop offset="35%" stop-color="#fb923c" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#candleBg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.4"/>

  <!-- Flame Glow Aura -->
  <circle cx="256" cy="180" r="130" fill="url(#flameGlow)"/>

  <!-- Open Book (Psaltirea) -->
  <g id="openBook">
    <!-- Cover Base -->
    <path d="M 100 370 Q 256 395 256 385 Q 256 395 412 370 L 416 385 Q 256 415 256 405 Q 256 415 96 385 Z" fill="url(#bookCover)"/>
    
    <!-- Left Page -->
    <path d="M 106 365 Q 186 345 252 355 L 252 270 Q 186 260 106 280 Z" fill="url(#pageGrad)" stroke="#b45309" stroke-width="1.5"/>
    <!-- Right Page -->
    <path d="M 406 365 Q 326 345 260 355 L 260 270 Q 326 260 406 280 Z" fill="url(#pageGrad)" stroke="#b45309" stroke-width="1.5"/>
    
    <!-- Lines of text on pages -->
    <g stroke="#92400e" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
      <line x1="126" y1="295" x2="230" y2="285"/>
      <line x1="126" y1="315" x2="230" y2="305"/>
      <line x1="126" y1="335" x2="230" y2="325"/>
      
      <line x1="282" y1="285" x2="386" y2="295"/>
      <line x1="282" y1="305" x2="386" y2="315"/>
      <line x1="282" y1="325" x2="386" y2="335"/>
    </g>

    <!-- Cross on the book bookmark -->
    <path d="M 256 360 L 256 425 Q 266 430 276 420 L 276 360 Z" fill="#b91c1c"/>
  </g>

  <!-- Vigil Lamp (Candela) -->
  <g id="candela">
    <!-- Glass bowl -->
    <path d="M 226 215 Q 256 240 286 215 L 276 250 Q 256 260 236 250 Z" fill="#ef4444" opacity="0.85" stroke="#fca5a5" stroke-width="1.5"/>
    <!-- Golden base & chains -->
    <ellipse cx="256" cy="254" rx="22" ry="6" fill="#f59e0b"/>
    <path d="M 236 250 L 246 270 L 266 270 L 276 250" fill="#d97706"/>
    <!-- Flame -->
    <path d="M 256 140 Q 272 175 264 195 Q 256 210 248 195 Q 240 175 256 140 Z" fill="#fbbf24"/>
    <path d="M 256 155 Q 264 180 260 195 Q 256 202 252 195 Q 248 180 256 155 Z" fill="#ffffff"/>
  </g>
</svg>
