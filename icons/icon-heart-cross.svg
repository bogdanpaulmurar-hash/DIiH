<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="heartBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2c1221"/>
      <stop offset="60%" stop-color="#140a16"/>
      <stop offset="100%" stop-color="#040206"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="45%" stop-color="#e11d48"/>
      <stop offset="85%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#heartBg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldH)" stroke-width="2" opacity="0.35"/>

  <!-- Halo around Heart -->
  <circle cx="256" cy="245" r="145" fill="none" stroke="url(#goldH)" stroke-width="2.5" stroke-dasharray="10,8" opacity="0.45"/>

  <!-- Stylized Sacred Heart of Prayer -->
  <path d="M 256 390 C 256 390 130 300 130 210 C 130 150 175 125 220 125 C 242 125 256 142 256 142 C 256 142 270 125 292 125 C 337 125 382 150 382 210 C 382 300 256 390 256 390 Z" fill="url(#heartGrad)" filter="url(#glowH)"/>

  <!-- Radiant Golden Cross emerging from Heart -->
  <g fill="url(#goldH)">
    <!-- Vertical -->
    <rect x="246" y="90" width="20" height="150" rx="4"/>
    <!-- Horizontal -->
    <rect x="210" y="130" width="92" height="18" rx="4"/>
    <!-- Small top bar -->
    <rect x="230" y="105" width="52" height="12" rx="3"/>
  </g>

  <!-- Golden Ray Accents -->
  <g stroke="url(#goldH)" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <line x1="256" y1="65" x2="256" y2="45"/>
    <line x1="185" y1="95" x2="170" y2="80"/>
    <line x1="327" y1="95" x2="342" y2="80"/>
  </g>

  <!-- Inscription -->
  <text x="256" y="445" fill="#fef08a" font-family="'Times New Roman', serif" font-weight="bold" font-size="22" letter-spacing="6" opacity="0.85" text-anchor="middle">DRAGOSTEA NU CADE</text>
</svg>
