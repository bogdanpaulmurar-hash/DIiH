<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a1208"/>
      <stop offset="60%" stop-color="#140703"/>
      <stop offset="100%" stop-color="#050201"/>
    </radialGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <path id="sealPrayerPath" d="M 256,88 A 168,168 0 1,1 255.9,88" fill="none"/>
  </defs>

  <!-- Outer Dark Circle -->
  <circle cx="256" cy="256" r="246" fill="url(#sealBg)" stroke="url(#goldSeal)" stroke-width="6"/>

  <!-- Thick Carved Outer Border with Inner Rim -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldSeal)" stroke-width="3"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#fef9c3" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.8"/>

  <!-- Inner Band for Inscription -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#goldSeal)" stroke-width="3.5"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#fef9c3" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.8"/>

  <!-- Center Medallion Field -->
  <circle cx="256" cy="256" r="136" fill="#1f0a04" stroke="url(#goldSeal)" stroke-width="2"/>

  <!-- Circular Jesus Prayer Inscription in Romanian -->
  <text fill="#fef3c7" font-family="'Times New Roman', Georgia, serif" font-size="18.5" font-weight="900" letter-spacing="3.2">
    <textPath href="#sealPrayerPath" startOffset="50%" text-anchor="middle">
      DOAMNE IISUSE HRISTOASE, FIUL LUI DUMNEZEU, MILUIEȘTE-MĂ PE MINE PĂCĂTOSUL †
    </textPath>
  </text>

  <!-- Central Chi-Rho (☧) with Alpha & Omega -->
  <g stroke="url(#goldSeal)" fill="url(#goldSeal)">
    <!-- Vertical Staff -->
    <line x1="256" y1="156" x2="256" y2="356" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Rho Loop -->
    <path d="M 256,156 C 302,156 302,220 256,220" fill="none" stroke-width="11" stroke-linecap="round"/>

    <!-- Diagonal X Arms -->
    <line x1="184" y1="184" x2="328" y2="328" stroke-width="11" stroke-linecap="round"/>
    <line x1="184" y1="328" x2="328" y2="184" stroke-width="11" stroke-linecap="round"/>

    <!-- Knobs at terminals -->
    <circle cx="256" cy="150" r="8"/>
    <circle cx="256" cy="362" r="8"/>
    <circle cx="178" cy="178" r="7.5"/>
    <circle cx="334" cy="334" r="7.5"/>
    <circle cx="178" cy="334" r="7.5"/>
    <circle cx="334" cy="178" r="7.5"/>

    <!-- Central Crossing Ring -->
    <circle cx="256" cy="256" r="12" fill="#1f0a04" stroke="url(#goldSeal)" stroke-width="3"/>

    <!-- Alpha (A) -->
    <text x="202" y="272" font-family="'Times New Roman', Georgia, serif" font-size="46" font-weight="bold" text-anchor="middle" stroke="none">A</text>

    <!-- Omega (Ω) -->
    <text x="310" y="272" font-family="'Times New Roman', Georgia, serif" font-size="44" font-weight="bold" text-anchor="middle" stroke="none">Ω</text>
  </g>
</svg>