<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMonogram" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="goldM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="cyanM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgMonogram)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldM)" stroke-width="2.5" opacity="0.5"/>

  <!-- Compass Outer Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldM)" stroke-width="3" opacity="0.4"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#cyanM)" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>

  <!-- Subtle Cross Navigation Markers -->
  <polygon points="256,76 264,106 248,106" fill="url(#goldM)"/>
  <polygon points="256,436 264,406 248,406" fill="url(#goldM)"/>
  <polygon points="76,256 106,248 106,264" fill="url(#goldM)"/>
  <polygon points="436,256 406,248 406,264" fill="url(#goldM)"/>

  <!-- Large Stylized Monogram DIiH -->
  <g id="letters" text-anchor="middle" dominant-baseline="central">
    <text x="256" y="248" fill="url(#goldM)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" letter-spacing="4">DIiH</text>
    <text x="256" y="320" fill="url(#cyanM)" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" letter-spacing="8" opacity="0.9">HUB • PRAVILĂ</text>
  </g>

  <!-- Crown/Cross on top of I -->
  <g fill="url(#goldM)">
    <circle cx="256" cy="154" r="8"/>
    <path d="M 252 144 L 260 144 L 258 132 L 254 132 Z"/>
    <line x1="248" y1="138" x2="264" y2="138" stroke="url(#goldM)" stroke-width="2.5"/>
  </g>
</svg>
