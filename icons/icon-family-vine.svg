<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="vineBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#02140e"/>
    </radialGradient>
    <linearGradient id="goldVine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="60%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <filter id="glowVine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundal Card PWA -->
  <rect width="512" height="512" rx="112" fill="url(#vineBg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldVine)" stroke-width="2" opacity="0.35"/>

  <!-- Nimb dublu circular -->
  <circle cx="256" cy="245" r="145" fill="none" stroke="url(#goldVine)" stroke-width="2" stroke-dasharray="10,6" opacity="0.45"/>
  <circle cx="256" cy="245" r="162" fill="none" stroke="url(#goldVine)" stroke-width="1" opacity="0.2"/>

  <!-- Cruce bizantină centrală de susținere -->
  <g stroke="url(#goldVine)" stroke-linecap="round">
    <line x1="256" y1="115" x2="256" y2="350" stroke-width="8"/>
    <line x1="180" y1="185" x2="332" y2="185" stroke-width="7"/>
    <!-- Braț scurt superior & oblic -->
    <line x1="210" y1="140" x2="302" y2="140" stroke-width="5"/>
    <line x1="215" y1="305" x2="297" y2="280" stroke-width="5"/>
    <!-- Bobițe aurii pe brațe -->
    <circle cx="256" cy="110" r="4.5" fill="#fef08a"/>
    <circle cx="175" cy="185" r="4" fill="#fef08a"/>
    <circle cx="337" cy="185" r="4" fill="#fef08a"/>
  </g>

  <!-- Ramuri de măslin / viță împletite (stânga și dreapta) -->
  <path d="M 256 340 Q 180 320 160 230 Q 150 180 185 140" fill="none" stroke="url(#goldVine)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 256 340 Q 332 320 352 230 Q 362 180 327 140" fill="none" stroke="url(#goldVine)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- Frunze stilizate -->
  <ellipse cx="170" cy="210" rx="14" ry="7" transform="rotate(-30 170 210)" fill="url(#goldVine)" opacity="0.7"/>
  <ellipse cx="185" cy="265" rx="14" ry="7" transform="rotate(35 185 265)" fill="url(#goldVine)" opacity="0.7"/>
  <ellipse cx="342" cy="210" rx="14" ry="7" transform="rotate(30 342 210)" fill="url(#goldVine)" opacity="0.7"/>
  <ellipse cx="327" cy="265" rx="14" ry="7" transform="rotate(-35 327 265)" fill="url(#goldVine)" opacity="0.7"/>

  <!-- Strugure roditor la bază (rodul familiei binecuvântate) -->
  <g transform="translate(256, 320)" filter="url(#glowVine)">
    <circle cx="-16" cy="0" r="9" fill="url(#grapeGrad)"/>
    <circle cx="0" cy="0" r="9" fill="url(#grapeGrad)"/>
    <circle cx="16" cy="0" r="9" fill="url(#grapeGrad)"/>
    <circle cx="-8" cy="15" r="8.5" fill="url(#grapeGrad)"/>
    <circle cx="8" cy="15" r="8.5" fill="url(#grapeGrad)"/>
    <circle cx="0" cy="28" r="8" fill="url(#grapeGrad)"/>
  </g>

  <!-- Text la bază -->
  <text x="256" y="440" font-family="'Times New Roman', serif" font-size="19" font-weight="bold" fill="url(#goldVine)" text-anchor="middle" letter-spacing="4" opacity="0.9">VIȚA BĂTRÂNĂ</text>
  <text x="256" y="462" font-family="'Times New Roman', serif" font-size="12" font-style="italic" fill="#a7f3d0" text-anchor="middle" letter-spacing="2" opacity="0.6">Mlădițe Roditoare • Ps. 127</text>
</svg>