  <!-- Inner Beaded Ochre Border -->
  <rect x="68" y="68" width="376" height="376" rx="24" fill="none" stroke="url(#goldFiligree)" stroke-width="2.5" stroke-dasharray="5,6" opacity="0.8"/>

  <!-- Brâncovenesc Corner Floral Ornaments -->
  <!-- Top-Left -->
  <g transform="translate(86, 86)" stroke="url(#goldFiligree)" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M 0,28 Q 0,0 28,0 Q 14,14 0,28 Z" fill="#d97706" opacity="0.4"/>
    <path d="M 4,20 Q 20,20 20,4"/>
    <circle cx="12" cy="12" r="3.5" fill="#fef08a"/>
    <circle cx="28" cy="4" r="2.5" fill="#fef08a"/>
    <circle cx="4" cy="28" r="2.5" fill="#fef08a"/>
  </g>
  <!-- Top-Right -->
  <g transform="translate(426, 86) scale(-1, 1)" stroke="url(#goldFiligree)" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M 0,28 Q 0,0 28,0 Q 14,14 0,28 Z" fill="#d97706" opacity="0.4"/>
    <path d="M 4,20 Q 20,20 20,4"/>
    <circle cx="12" cy="12" r="3.5" fill="#fef08a"/>
    <circle cx="28" cy="4" r="2.5" fill="#fef08a"/>
    <circle cx="4" cy="28" r="2.5" fill="#fef08a"/>
  </g>
  <!-- Bottom-Left -->
  <g transform="translate(86, 426) scale(1, -1)" stroke="url(#goldFiligree)" fill="none" stroke-width="2" stroke-linecap="round">
