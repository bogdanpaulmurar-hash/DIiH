      <stop offset="50%" stop-color="#290e03"/>
      <stop offset="100%" stop-color="#190601"/>
    </linearGradient>
    <radialGradient id="carmineField" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="85%" stop-color="#550c0c"/>
      <stop offset="100%" stop-color="#360505"/>
    </radialGradient>
    <radialGradient id="parchmentMedallion" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
