  <!-- Top and Bottom Rosettes -->
  <g fill="url(#goldFiligree)" stroke="#78350f" stroke-width="1">
    <!-- Top Rosette -->
    <circle cx="256" cy="88" r="8"/>
    <circle cx="244" cy="88" r="4.5"/>
    <circle cx="268" cy="88" r="4.5"/>
    <circle cx="256" cy="76" r="4.5"/>
    <circle cx="256" cy="100" r="4.5"/>
    <!-- Bottom Rosette -->
    <circle cx="256" cy="424" r="8"/>
    <circle cx="244" cy="424" r="4.5"/>
    <circle cx="268" cy="424" r="4.5"/>
    <circle cx="256" cy="412" r="4.5"/>
    <circle cx="256" cy="436" r="4.5"/>
  </g>

  <!-- Dark Circular Ring for the Romanian Jesus Prayer -->
  <circle cx="256" cy="256" r="142" fill="#1c0a06" stroke="url(#goldFiligree)" stroke-width="3"/>
  <circle cx="256" cy="256" r="86" fill="url(#parchmentMedallion)" stroke="#7f1d1d" stroke-width="3"/>

  <!-- Beaded ring on border of text -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3,5" opacity="0.75"/>
  <circle cx="256" cy="256" r="88" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3,5" opacity="0.75"/>

  <!-- Circular Romanian Jesus Prayer in traditional majuscule font -->
  <text fill="#fef3c7" font-family="'Times New Roman', Georgia, serif" font-size="12.5" font-weight="bold" letter-spacing="2.2">
    <textPath href="#prayerPath" startOffset="50%" text-anchor="middle">
      DOAMNE IISUSE HRISTOASE, FIUL LUI DUMNEZEU, MILUIEȘTE-MĂ PE MINE PĂCĂTOSUL †
    </textPath>
  </text>

  <!-- Central Chrismon / Monogram of Christ (Chi-Rho / ☧) with Budded Terminals -->
  <g id="chrismon" stroke="#7f1d1d" fill="#7f1d1d">
    <!-- Vertical Staff (Iota / Rho) -->
    <line x1="256" y1="184" x2="256" y2="326" stroke-width="9" stroke-linecap="round"/>
    <!-- Rho Loop -->
    <path d="M 256,184 C 288,184 288,230 256,230" fill="none" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Diagonal X Arms -->
    <line x1="202" y1="202" x2="310" y2="310" stroke-width="8" stroke-linecap="round"/>
    <line x1="202" y1="310" x2="310" y2="202" stroke-width="8" stroke-linecap="round"/>

    <!-- Budded Terminal Dots at ends -->
    <circle cx="256" cy="180" r="6" fill="#7f1d1d"/>
    <circle cx="256" cy="330" r="6" fill="#7f1d1d"/>
    <circle cx="198" cy="198" r="5.5" fill="#7f1d1d"/>
    <circle cx="314" cy="314" r="5.5" fill="#7f1d1d"/>
    <circle cx="198" cy="314" r="5.5" fill="#7f1d1d"/>
    <circle cx="314" cy="198" r="5.5" fill="#7f1d1d"/>

    <!-- Central Crossing Knot -->
    <circle cx="256" cy="256" r="6.5" fill="#fef3c7" stroke="#7f1d1d" stroke-width="2.5"/>

    <!-- Alpha (A) -->
    <text x="216" y="268" font-family="'Times New Roman', Georgia, serif" font-size="34" font-weight="bold" text-anchor="middle" stroke="none">A</text>

    <!-- Omega (Ω) -->
    <text x="296" y="268" font-family="'Times New Roman', Georgia, serif" font-size="32" font-weight="bold" text-anchor="middle" stroke="none">Ω</text>
  </g>
</svg>