<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="homeBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="goldHome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glowHome" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundal Card PWA -->
  <rect width="512" height="512" rx="112" fill="url(#homeBg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldHome)" stroke-width="2" opacity="0.35"/>

  <!-- Nimb de lumină în jurul căminului -->
  <circle cx="256" cy="270" r="140" fill="none" stroke="url(#goldHome)" stroke-width="2" stroke-dasharray="8,6" opacity="0.4"/>
  <circle cx="256" cy="270" r="160" fill="none" stroke="url(#goldHome)" stroke-width="1" opacity="0.2"/>

  <!-- Acoperiș stilizat cămin -->
  <path d="M 120 250 L 256 140 L 392 250" fill="none" stroke="url(#roofGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 140 250 L 256 156 L 372 250" fill="none" stroke="url(#goldHome)" stroke-width="3" stroke-linecap="round"/>

  <!-- Pereți & Bază Cămin -->
  <path d="M 160 245 L 160 380 Q 160 395 175 395 L 337 395 Q 352 395 352 380 L 352 245" fill="none" stroke="url(#goldHome)" stroke-width="6" opacity="0.8"/>

  <!-- Cruce pe acoperiș -->
  <g transform="translate(256, 120)" stroke="url(#goldHome)" stroke-linecap="round">
    <line x1="0" y1="-26" x2="0" y2="10" stroke-width="7"/>
    <line x1="-12" y1="-14" x2="12" y2="-14" stroke-width="6"/>
    <circle cx="0" cy="-28" r="3" fill="#fef08a"/>
    <circle cx="-14" cy="-14" r="2.5" fill="#fef08a"/>
    <circle cx="14" cy="-14" r="2.5" fill="#fef08a"/>
  </g>

  <!-- Ușă arcuită cu lumină caldă -->
  <path d="M 226 395 L 226 315 Q 226 280 256 280 Q 286 280 286 315 L 286 395 Z" fill="url(#warmLight)" opacity="0.85" filter="url(#glowHome)"/>
  <path d="M 226 395 L 226 315 Q 226 280 256 280 Q 286 280 286 315 L 286 395" fill="none" stroke="url(#goldHome)" stroke-width="4"/>

  <!-- Cruce bizantină în interiorul luminii căminului -->
  <line x1="256" y1="295" x2="256" y2="350" stroke="#451a03" stroke-width="4" stroke-linecap="round"/>
  <line x1="242" y1="315" x2="270" y2="315" stroke="#451a03" stroke-width="4" stroke-linecap="round"/>

  <!-- Text decorativ la bază -->
  <text x="256" y="440" font-family="'Times New Roman', serif" font-size="19" font-weight="bold" fill="url(#goldHome)" text-anchor="middle" letter-spacing="4" opacity="0.9">CĂMINUL FAMILIEI</text>
  <text x="256" y="462" font-family="'Times New Roman', serif" font-size="12" font-style="italic" fill="#cbd5e1" text-anchor="middle" letter-spacing="2" opacity="0.6">Pace &amp; Binecuvântare</text>
</svg>